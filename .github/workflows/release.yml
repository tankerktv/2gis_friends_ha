# Создаёт GitHub Release, когда сюда приезжает тег vX.Y.Z.
#
# Зачем на стороне GitHub, а не в GitLab CI: здесь есть встроенный GITHUB_TOKEN,
# который выдаётся job'у автоматически. Никакого PAT заводить и хранить не нужно,
# и раннер GitLab для релизов тоже не требуется.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Проверить, что версия в манифесте совпадает с тегом
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python3 -c "import json;print(json.load(open('custom_components/twogis_friends/manifest.json'))['version'])")
          echo "тег: $TAG, manifest: $VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::версия в manifest.json ($VERSION) не совпадает с тегом ($TAG)"
            echo "HACS поставит одно, а Home Assistant покажет другое — правь и перевыпускай тег"
            exit 1
          fi

      - name: Собрать описание из CHANGELOG
        run: python3 tools/changelog_section.py "$GITHUB_REF_NAME" > /tmp/notes.md

      - name: Создать релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Описание берём из CHANGELOG.md, а не из --generate-notes:
          # список коммитов человеку читать неудобно.
          #
          # Тег может приехать повторно: например, когда история публичного
          # зеркала переписывается и теги сдвигаются на новые коммиты.
          # Тогда релиз уже существует, и `create` упал бы. Обновляем.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "релиз $GITHUB_REF_NAME уже есть — обновляю описание"
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file /tmp/notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file /tmp/notes.md
          fi
