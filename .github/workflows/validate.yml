# Гоняется на зеркале в GitHub. Ловит ошибки манифеста и структуры до того,
# как HACS попробует поставить релиз.
name: Validate

on:
  push:
  pull_request:
  schedule:
    # HACS и hassfest меняют требования, поэтому проверяемся и без коммитов
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  tests:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Home Assistant не ставим намеренно: тесты проверяют разбор протокола
      # и построение рамки — логику, которая ломается молча, когда 2ГИС
      # что-то меняет у себя. Подробности — в tests/conftest.py.
      - run: pip install pytest pytest-asyncio aiohttp
      - run: python -m pytest -q

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      # actions/checkout здесь не нужен: hacs/action забирает репозиторий
      # через GitHub API, а не с диска раннера
      # brands не отключаем: для попадания в дефолтный стор HACS эта проверка
      # обязана проходить. С Home Assistant 2026.3 её должен закрывать
      # собственный каталог brand/ внутри интеграции.
      - uses: hacs/action@main
        with:
          category: integration
