# GitLab — источник истины. GitHub нужен только потому, что HACS умеет ходить
# исключительно в него.
#
# Схема веток:
#   development — рабочая, НЕ зеркалируется
#   main        — то, что опубликовано; один в один уезжает в GitHub
#
# Публикация = слить development в main и запушить main.
# Релиз      = поднять версию в manifest.json и дописать раздел в CHANGELOG.md.
#              Тег ставит сам пайплайн, см. release:tag ниже. Руками
#              `git tag` тоже можно — тогда release:tag просто ничего не делает.
#
# Релизы GitHub здесь НЕ создаются: это делает .github/workflows/release.yml
# на стороне GitHub, где токен выдаётся job'у автоматически. Дублировать
# создание релиза с двух сторон нельзя — второй получит 422 и покрасит пайплайн.
#
# Переменные проекта (Settings -> CI/CD -> Variables):
#   GITHUB_TOKEN — fine-grained PAT, Contents: read/write на репозиторий-зеркало.
#                  Masked, без Protect (иначе не виден пайплайнам на тегах).
#   GITHUB_REPO  — необязательна, по умолчанию берётся значение ниже.
#   TAG_TOKEN    — токен проекта GitLab со scope write_repository, для release:tag.
#                  Masked. Нужен потому, что CI_JOB_TOKEN писать в репозиторий
#                  не умеет. Без переменной release:tag просто ничего не делает,
#                  и тег ставится руками как раньше.

variables:
  GITHUB_REPO: "tankerktv/2gis_friends_ha"
  # Публикуемая ветка называется одинаково с обеих сторон — переименовывать
  # при пуше не нужно, и схема остаётся симметричной.
  PUBLIC_BRANCH: "main"

stages: [validate, tag, mirror]

default:
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache git curl jq >/dev/null

# --- проверки ---------------------------------------------------------------

validate:manifest:
  stage: validate
  script:
    - |
      python - <<'PY'
      import json, os, pathlib, re, sys

      root = pathlib.Path(".")
      manifest = json.loads((root / "custom_components/twogis_friends/manifest.json").read_text())
      hacs = json.loads((root / "hacs.json").read_text())

      errors = []
      # HACS требует, чтобы эти ключи были не просто объявлены, а непустыми.
      # Проверка только на наличие пропустила codeowners: [] и валидация HACS
      # падала на уже опубликованном релизе.
      for key in ("domain", "name", "version", "documentation", "issue_tracker", "codeowners"):
          if key not in manifest:
              errors.append(f"manifest.json: нет обязательного ключа {key!r}")
          elif not manifest[key]:
              errors.append(f"manifest.json: ключ {key!r} пустой, HACS такое не принимает")
      if not re.fullmatch(r"\d+\.\d+\.\d+", manifest.get("version", "")):
          errors.append(f"manifest.json: version {manifest.get('version')!r} не вида X.Y.Z")
      if "name" not in hacs:
          errors.append("hacs.json: нет ключа 'name'")

      # HACS проверяет наличие лицензии, и отключить эту проверку нельзя
      if not any((root / n).exists() for n in ("LICENSE", "LICENSE.md", "LICENSE.txt")):
          errors.append("нет файла LICENSE — валидация HACS этого не прощает")

      tag = os.environ.get("CI_COMMIT_TAG")
      if tag:
          # на релизе требования строже: версия обязана совпадать с тегом,
          # иначе HACS поставит одно, а HA покажет другое
          if "CHANGE_ME" in json.dumps(manifest):
              errors.append("manifest.json: перед релизом заменить CHANGE_ME в ссылках")
          if tag.lstrip("v") != manifest["version"]:
              errors.append(f"тег {tag} не совпадает с manifest version {manifest['version']}")
          # Описание релиза собирается из CHANGELOG, поэтому без раздела
          # релиз уехал бы с пустым текстом.
          changelog = (root / "CHANGELOG.md")
          if not changelog.exists():
              errors.append("нет CHANGELOG.md")
          elif f"## [{tag.lstrip('v')}]" not in changelog.read_text(encoding="utf-8"):
              errors.append(f"в CHANGELOG.md нет раздела '## [{tag.lstrip('v')}]'")

      for e in errors:
          print("ОШИБКА:", e)
      sys.exit(1 if errors else 0)
      PY

validate:python:
  stage: validate
  script:
    - python -m compileall -q custom_components bridge tools

validate:tests:
  stage: validate
  script:
    # Home Assistant не ставим: тесты трогают только разбор протокола и
    # построение рамки, а это чистая логика без зависимостей от HA.
    # Как модули загружаются в обход __init__.py — см. tests/conftest.py.
    - pip install --quiet --disable-pip-version-check pytest pytest-asyncio aiohttp
    - python -m pytest -q

# --- тег --------------------------------------------------------------------

release:tag:
  stage: tag
  # Только на публикуемой ветке. На пайплайне самого тега не запускается —
  # там CI_COMMIT_BRANCH пуст, иначе получилось бы кольцо.
  rules:
    - if: $CI_COMMIT_BRANCH == $PUBLIC_BRANCH
  script:
    # Решение принимает Python: разбирать JSON и CHANGELOG в shell — верный
    # способ однажды выпустить релиз не той версии.
    - |
      python - <<'PY' > tag_reshenie.txt
      import json, pathlib, re

      manifest = json.loads(
          pathlib.Path("custom_components/twogis_friends/manifest.json").read_text(encoding="utf-8")
      )
      version = manifest.get("version", "")
      changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")

      if not re.fullmatch(r"\d+\.\d+\.\d+", version):
          print("SKIP: version %r не вида X.Y.Z" % version)
      elif not re.search(r"^## \[%s\] — \d{4}-\d{2}-\d{2}\s*$" % re.escape(version),
                         changelog, re.M):
          # Раздел с датой — это и есть признак «версия готова к выпуску».
          # Пока правки лежат под «## [Не выпущено]», тег не ставится.
          print("SKIP: в CHANGELOG.md нет раздела '## [%s] — ДАТА'" % version)
      else:
          print("TAG v%s" % version)
      PY
    - cat tag_reshenie.txt
    - |
      if grep -q '^SKIP' tag_reshenie.txt; then
        echo "версия не готова к выпуску — тег не ставлю"
        exit 0
      fi
      tag=$(sed -n 's/^TAG //p' tag_reshenie.txt)

      if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
        echo "тег $tag уже есть — ничего не делаю"
        exit 0
      fi

      if [ -z "$TAG_TOKEN" ]; then
        echo "нет переменной TAG_TOKEN — тег $tag надо поставить руками:"
        echo "  git tag -a $tag -m $tag && git push origin $tag"
        exit 0
      fi

      git config user.email "ci@${CI_SERVER_HOST}"
      git config user.name "GitLab CI"
      git tag -a "$tag" -m "$tag"
      # ci.skip: тег и так уедет на GitHub из этого же пайплайна, стадией ниже.
      # Без этого тег завёл бы вторую сборку, делающую ровно то же самое.
      git remote add tagger "https://oauth2:${TAG_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git push -o ci.skip tagger "$tag"
      echo "поставлен тег $tag"
  artifacts:
    paths: [tag_reshenie.txt]
    expire_in: 1 week

# --- зеркало ----------------------------------------------------------------

mirror:github:
  stage: mirror
  variables:
    # Полная история. По умолчанию раннер клонирует последние 20 коммитов,
    # а теги указывают на более старые: git не может отправить объекты,
    # которых у него нет, и `push --tags` падает с
    # "did not receive expected object ... remote unpack failed".
    GIT_DEPTH: "0"
  script:
    - test -n "$GITHUB_TOKEN" || { echo "нет переменной GITHUB_TOKEN"; exit 1; }
    - apk add --no-cache bash >/dev/null
    # Вырезает docs/ из истории перед публикацией — см. комментарий в скрипте.
    - pip install --quiet --disable-pip-version-check git-filter-repo
    - git remote remove github 2>/dev/null || true
    - git remote add github "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"
    # Правила преобразования живут в скрипте, а не здесь: он же вызывается
    # вручную, и дублировать их в двух местах — верный способ разъехаться.
    # Теги он тоже публикует сам — из отфильтрованной истории, иначе они
    # указывали бы на коммиты с docs/.
    - PUBLISH_REMOTE=github PUBLISH_BRANCH="$PUBLIC_BRANCH" bash tools/publish_github.sh
    - echo "опубликовано в https://github.com/${GITHUB_REPO}/tree/${PUBLIC_BRANCH}"
  rules:
    # ЗЕРКАЛИТСЯ ТОЛЬКО main. development сюда не попадает никогда.
    - if: $CI_COMMIT_BRANCH == $PUBLIC_BRANCH
    - if: $CI_COMMIT_TAG
