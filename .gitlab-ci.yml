# GitLab — источник истины. GitHub нужен только потому, что HACS умеет ходить
# исключительно в него.
#
# Схема веток:
#   development — рабочая, НЕ зеркалируется
#   main        — то, что опубликовано; один в один уезжает в GitHub
#
# Публикация = слить development в main и запушить main.
# Релиз      = поставить тег vX.Y.Z на main.
#
# Релизы GitHub здесь НЕ создаются: это делает .github/workflows/release.yml
# на стороне GitHub, где токен выдаётся job'у автоматически. Дублировать
# создание релиза с двух сторон нельзя — второй получит 422 и покрасит пайплайн.
#
# Переменные проекта (Settings -> CI/CD -> Variables):
#   GITHUB_TOKEN — fine-grained PAT, Contents: read/write на репозиторий-зеркало.
#                  Masked, без Protect (иначе не виден пайплайнам на тегах).
#   GITHUB_REPO  — необязательна, по умолчанию берётся значение ниже.

variables:
  GITHUB_REPO: "tankerktv/2gis_friends_ha"
  # Публикуемая ветка называется одинаково с обеих сторон — переименовывать
  # при пуше не нужно, и схема остаётся симметричной.
  PUBLIC_BRANCH: "main"

stages: [validate, mirror]

default:
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache git curl jq >/dev/null

# --- проверки ---------------------------------------------------------------

validate:manifest:
  stage: validate
  script:
    - |
      python - <<'PY'
      import json, os, pathlib, re, sys

      root = pathlib.Path(".")
      manifest = json.loads((root / "custom_components/twogis_friends/manifest.json").read_text())
      hacs = json.loads((root / "hacs.json").read_text())

      errors = []
      # HACS требует, чтобы эти ключи были не просто объявлены, а непустыми.
      # Проверка только на наличие пропустила codeowners: [] и валидация HACS
      # падала на уже опубликованном релизе.
      for key in ("domain", "name", "version", "documentation", "issue_tracker", "codeowners"):
          if key not in manifest:
              errors.append(f"manifest.json: нет обязательного ключа {key!r}")
          elif not manifest[key]:
              errors.append(f"manifest.json: ключ {key!r} пустой, HACS такое не принимает")
      if not re.fullmatch(r"\d+\.\d+\.\d+", manifest.get("version", "")):
          errors.append(f"manifest.json: version {manifest.get('version')!r} не вида X.Y.Z")
      if "name" not in hacs:
          errors.append("hacs.json: нет ключа 'name'")

      # HACS проверяет наличие лицензии, и отключить эту проверку нельзя
      if not any((root / n).exists() for n in ("LICENSE", "LICENSE.md", "LICENSE.txt")):
          errors.append("нет файла LICENSE — валидация HACS этого не прощает")

      tag = os.environ.get("CI_COMMIT_TAG")
      if tag:
          # на релизе требования строже: версия обязана совпадать с тегом,
          # иначе HACS поставит одно, а HA покажет другое
          if "CHANGE_ME" in json.dumps(manifest):
              errors.append("manifest.json: перед релизом заменить CHANGE_ME в ссылках")
          if tag.lstrip("v") != manifest["version"]:
              errors.append(f"тег {tag} не совпадает с manifest version {manifest['version']}")

      for e in errors:
          print("ОШИБКА:", e)
      sys.exit(1 if errors else 0)
      PY

validate:python:
  stage: validate
  script:
    - python -m compileall -q custom_components bridge tools

# --- зеркало ----------------------------------------------------------------

mirror:github:
  stage: mirror
  script:
    - test -n "$GITHUB_TOKEN" || { echo "нет переменной GITHUB_TOKEN"; exit 1; }
    - git config user.email "ci@gitlab"
    - git config user.name "GitLab CI"
    # Подмена README для публичной стороны. Пока README.public.md нет —
    # шаг ничего не делает, и ветки остаются идентичными.
    - |
      if [ -f README.public.md ]; then
        echo "подменяю README.md на README.public.md"
        mv README.public.md README.md
        git add -A
        git commit -q -m "README для публичной версии [ci skip]"
      fi
    - git remote remove github 2>/dev/null || true
    - git remote add github "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"
    # --force осознанно: зеркало по определению следует за источником
    - git push github "HEAD:refs/heads/${PUBLIC_BRANCH}" --force
    - git push github --tags --force
    - echo "опубликовано в https://github.com/${GITHUB_REPO}/tree/${PUBLIC_BRANCH}"
  rules:
    # ЗЕРКАЛИТСЯ ТОЛЬКО main. development сюда не попадает никогда.
    - if: $CI_COMMIT_BRANCH == $PUBLIC_BRANCH
    - if: $CI_COMMIT_TAG
